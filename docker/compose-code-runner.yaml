# CloudCode Arena - Dedicated Hardened Sandbox Code Runner (GCP Deployment)
services:
  code-runner:
    image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPO}/code-runner:latest
    container_name: cca-code-runner
    restart: always
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=production
      - CODE_RUNNER_PORT=5005
      - CODE_EXEC_TIMEOUT_MS=5000
      - MAX_OUTPUT_SIZE_BYTES=65536
      - MAX_CODE_SIZE_BYTES=65536
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
