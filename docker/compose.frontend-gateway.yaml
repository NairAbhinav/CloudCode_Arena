# Deployment Group 1: Frontend & Public API Entry Point (Public-facing VM)
version: '3.8'

services:
  frontend:
    image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPO}/frontend:latest
    restart: always
    ports:
      - "80:3000"
      - "443:3000"
    environment:
      - VITE_API_URL=${PUBLIC_API_URL}

  api-gateway:
    image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPO}/api-gateway:latest
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - API_GATEWAY_PORT=5000
      - AUTH_SERVICE_URL=http://${INTERNAL_BACKEND_IP}:5001
      - ASSESSMENT_SERVICE_URL=http://${INTERNAL_BACKEND_IP}:5002
      - SUBMISSION_SERVICE_URL=http://${INTERNAL_BACKEND_IP}:5003
      - REPORTING_SERVICE_URL=http://${INTERNAL_BACKEND_IP}:5004
      - CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}
