# CloudCode Arena - Reporting, Analytics & Anti-Cheating Service (GCP Deployment)
services:
  reporting-service:
    image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPO}/reporting-service:latest
    container_name: cca-reporting-service
    restart: always
    ports:
      - "5004:5004"
    environment:
      - NODE_ENV=production
      - REPORTING_SERVICE_PORT=5004
      - MONGO_URI=${MONGO_URI:-mongodb://${INTERNAL_DB_IP}:27017/cloudcode_arena}
      - JWT_SECRET=${JWT_SECRET}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
